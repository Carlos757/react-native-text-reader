packages:
  - '.'
  - 'example'

# Dev monorepo: allow latest releases during dependency upgrades
minimumReleaseAge: 0

allowBuilds:
  '@evilmartians/lefthook': true
  unrs-resolver: true

# All of these are transitive *development* dependencies (Metro, Babel, Jest,
# ESLint, the Expo example app). The published package ships no runtime
# dependencies, so none of them ever reach a consumer's app — the overrides
# keep `pnpm audit` clean for contributors and CI.
#
# Version-scoped keys (`name@major`) are required where several majors coexist
# in the tree: a blanket range would collapse them onto one incompatible major.
overrides:
  '@types/react': '^19.2.17'
  '@xmldom/xmldom': '^0.8.15'
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  browserslist: '^4.28.8'
  fast-uri: '^3.1.7'
  ip-address: '^10.7.0'
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  'nanoid@3': '^3.3.18'
  postcss: '^8.5.26'
  shell-quote: '^1.10.0'
  tar: '>=7.5.11'
  undici: '^8.10.1'

auditConfig:
  # image-size 1.2.1 comes from @expo/image-utils (example app only). Both
  # advisories are fixed in ">=2.0.3", which has never been published — 2.0.2
  # is the latest release — so there is no version to upgrade to. Both are
  # denial of service in image parsers that only run at build time.
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
